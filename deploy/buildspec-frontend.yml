version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd frontend
      - npm ci --prefer-offline

  build:
    commands:
      - cd frontend
      - echo "Building frontend with VITE_API_BASE=${VITE_API_BASE}"
      - npm run build

  post_build:
    commands:
      - echo "Syncing to S3..."
      - aws s3 sync frontend/dist/ s3://${FRONTEND_BUCKET}/ --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
      - aws s3 cp frontend/dist/index.html s3://${FRONTEND_BUCKET}/index.html --cache-control "no-cache,no-store,must-revalidate"
      - echo "Frontend deployed to s3://${FRONTEND_BUCKET}/"
