[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethertest"
version = "0.1.0"
description = "AetherTest — Autonomous Multi-Agent AI Testing Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "boto3>=1.34.0,<2.0.0",
    "botocore>=1.34.0,<2.0.0",
]

[tool.setuptools.packages.find]
include = ["aethertest*", "layers*", "lambdas*"]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "moto[dynamodb,s3,sns,sqs,events]>=5.0.0",
]
dev = [
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["layers", "lambdas", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
